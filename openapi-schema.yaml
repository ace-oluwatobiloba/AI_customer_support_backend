openapi: 3.0.3
info:
  title: AI Customer Support Backend API
  version: 1.0.0
  description: REST API for customer support, including authentication, knowledge-base
    management, ticket management, assignments, and escalation workflows.
paths:
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      description: Register a customer and send an email-verification message.
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRegistration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomerRegistration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomerRegistration'
        required: true
      security:
      - {}
      responses:
        '201':
          description: Customer registered successfully.
        '400':
          description: Registration data failed validation.
        '503':
          description: Registration could not be completed.
  /api/v1/auth/token/:
    post:
      operationId: v1_auth_token_create
      description: Obtain JWT tokens after successful credential and policy checks.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifiedEmailTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifiedEmailTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifiedEmailTokenObtainPair'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiedEmailTokenObtainPair'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: Refresh JWT tokens only for eligible accounts.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EligibleAccountTokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EligibleAccountTokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EligibleAccountTokenRefresh'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibleAccountTokenRefresh'
          description: ''
  /api/v1/auth/verify-email/:
    post:
      operationId: v1_auth_verify_email_create
      description: Verify an email address using a signed verification token.
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerification'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerification'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerification'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Email verified successfully.
        '400':
          description: The verification token is invalid or expired.
  /api/v1/knowledge/documents/:
    post:
      operationId: v1_knowledge_documents_create
      description: Create a new knowledge-base document and its first version.
      tags:
      - Knowledge Base
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/KnowledgeDocumentUpload'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/KnowledgeDocumentUpload'
        required: true
      security:
      - BearerAuth: []
      responses:
        '201':
          description: Knowledge-base document created successfully.
        '400':
          description: The upload failed validation or processing.
  /api/v1/knowledge/documents/{document_id}/versions/:
    post:
      operationId: v1_knowledge_documents_versions_create
      description: Add a new version to an explicitly identified document.
      parameters:
      - in: path
        name: document_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Knowledge Base
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/KnowledgeDocumentVersionUpload'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/KnowledgeDocumentVersionUpload'
        required: true
      security:
      - BearerAuth: []
      responses:
        '201':
          description: Document version uploaded successfully.
        '400':
          description: The upload failed validation or processing.
        '404':
          description: The requested document does not exist.
  /api/v1/support/tickets/:
    get:
      operationId: v1_support_tickets_list
      description: List tickets visible to the current user or create a customer ticket.
      tags:
      - v1
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
          description: ''
    post:
      operationId: v1_support_tickets_create
      description: List tickets visible to the current user or create a customer ticket.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ticket'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Ticket'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Ticket'
        required: true
      security:
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
          description: ''
  /api/v1/support/tickets/{ticket_id}/:
    get:
      operationId: v1_support_tickets_retrieve
      parameters:
      - in: path
        name: ticket_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
          description: ''
  /api/v1/support/tickets/{ticket_id}/assignments/:
    get:
      operationId: v1_support_tickets_assignments_retrieve
      description: |-
        List assignment history or assign/reassign a ticket.

        Only active administrators may access this endpoint.
      parameters:
      - in: path
        name: ticket_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketAssignmentCreate'
          description: ''
    post:
      operationId: v1_support_tickets_assignments_create
      description: |-
        List assignment history or assign/reassign a ticket.

        Only active administrators may access this endpoint.
      parameters:
      - in: path
        name: ticket_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketAssignmentCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TicketAssignmentCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TicketAssignmentCreate'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketAssignmentCreate'
          description: ''
  /api/v1/support/tickets/{ticket_id}/escalations/:
    get:
      operationId: v1_support_tickets_escalations_retrieve
      description: |-
        Create escalations and retrieve a ticket's escalation history.

        Active agents may access tickets currently assigned to them.
        Active administrators may access any eligible ticket.
      parameters:
      - in: path
        name: ticket_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketEscalationCreate'
          description: ''
    post:
      operationId: v1_support_tickets_escalations_create
      description: |-
        Create escalations and retrieve a ticket's escalation history.

        Active agents may access tickets currently assigned to them.
        Active administrators may access any eligible ticket.
      parameters:
      - in: path
        name: ticket_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketEscalationCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TicketEscalationCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TicketEscalationCreate'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketEscalationCreate'
          description: ''
components:
  schemas:
    CategoryEnum:
      enum:
      - ACCOUNT
      - BILLING
      - TECHNICAL_SUPPORT
      - DELIVERY
      - CANCELLATION
      - REFUND
      - GENERAL_INQUIRY
      - OTHER
      type: string
      description: |-
        * `ACCOUNT` - Account
        * `BILLING` - Billing
        * `TECHNICAL_SUPPORT` - Technical Support
        * `DELIVERY` - Delivery
        * `CANCELLATION` - Cancellation
        * `REFUND` - Refund
        * `GENERAL_INQUIRY` - General Inquiry
        * `OTHER` - Other
    CreatedSourceEnum:
      enum:
      - CUSTOMER
      - AGENT
      - ADMIN
      - AI
      type: string
      description: |-
        * `CUSTOMER` - Customer
        * `AGENT` - Agent
        * `ADMIN` - Admin
        * `AI` - AI
    CustomerRegistration:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
        password_confirm:
          type: string
          writeOnly: true
      required:
      - email
      - password
      - password_confirm
    EligibleAccountTokenRefresh:
      type: object
      description: Reject refresh attempts from ineligible accounts.
      properties:
        refresh:
          type: string
        access:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    EmailVerification:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
      required:
      - token
    KnowledgeDocumentUpload:
      type: object
      description: Validate requests that create a new logical document.
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        file:
          type: string
          format: uri
          writeOnly: true
      required:
      - file
      - title
    KnowledgeDocumentVersionUpload:
      type: object
      description: Validate requests that add a version to an existing document.
      properties:
        file:
          type: string
          format: uri
          writeOnly: true
        description:
          type: string
          nullable: true
      required:
      - file
    PriorityEnum:
      enum:
      - LOW
      - MEDIUM
      - HIGH
      - URGENT
      type: string
      description: |-
        * `LOW` - Low
        * `MEDIUM` - Medium
        * `HIGH` - High
        * `URGENT` - Urgent
    StatusEnum:
      enum:
      - OPEN
      - IN_PROGRESS
      - WAITING_FOR_CUSTOMER
      - ESCALATED
      - RESOLVED
      - CLOSED
      type: string
      description: |-
        * `OPEN` - Open
        * `IN_PROGRESS` - In Progress
        * `WAITING_FOR_CUSTOMER` - Waiting for Customer
        * `ESCALATED` - Escalated
        * `RESOLVED` - Resolved
        * `CLOSED` - Closed
    Ticket:
      type: object
      description: Serialize ticket data while protecting server-managed fields.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        ticket_number:
          type: string
          readOnly: true
        customer:
          type: string
          format: uuid
          readOnly: true
        customer_email:
          type: string
          format: email
          readOnly: true
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_by_email:
          type: string
          format: email
          readOnly: true
          nullable: true
        created_source:
          allOf:
          - $ref: '#/components/schemas/CreatedSourceEnum'
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          readOnly: true
        category:
          $ref: '#/components/schemas/CategoryEnum'
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        closed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - closed_at
      - created_at
      - created_by
      - created_by_email
      - created_source
      - customer
      - customer_email
      - description
      - id
      - priority
      - resolved_at
      - status
      - ticket_number
      - title
      - updated_at
    TicketAssignmentCreate:
      type: object
      description: Validate an assignment or reassignment request.
      properties:
        agent_id:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 5000
      required:
      - agent_id
    TicketEscalationCreate:
      type: object
      properties:
        reason:
          type: string
          maxLength: 5000
        trigger:
          $ref: '#/components/schemas/TriggerEnum'
        conversation_id:
          type: string
          format: uuid
          nullable: true
      required:
      - reason
      - trigger
    TriggerEnum:
      enum:
      - CUSTOMER_REQUEST
      - AI_CONFIDENCE
      - BUSINESS_RULE
      - AGENT_REQUEST
      - ADMIN_REQUEST
      type: string
      description: |-
        * `CUSTOMER_REQUEST` - Customer Request
        * `AI_CONFIDENCE` - AI Confidence
        * `BUSINESS_RULE` - Business Rule
        * `AGENT_REQUEST` - Agent Request
        * `ADMIN_REQUEST` - Admin Request
    VerifiedEmailTokenObtainPair:
      type: object
      description: Issue JWT tokens only to eligible, email-verified users.
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
